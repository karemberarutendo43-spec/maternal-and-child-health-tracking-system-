<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#fff}
    .card{max-width:520px;padding:24px;border:1px solid rgba(255,255,255,.15);border-radius:16px;background:rgba(255,255,255,.06)}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0;color:rgba(255,255,255,.85);line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>This system needs an internet/network connection to save changes. You can still view some cached pages and assets. When you are back online, refresh the page and try again.</p>
  </div>
</body>
</html>
